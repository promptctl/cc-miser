services:
  # Jaeger. The UI is the point; its OTLP ports stay internal so the collector owns
  # the single ingest address.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cc-miser-jaeger
    ports:
      - "16686:16686" # UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: cc-miser-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC  <- point Claude Code here
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape target
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    container_name: cc-miser-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=200h"
    depends_on:
      - otel-collector

volumes:
  prometheus_data:
